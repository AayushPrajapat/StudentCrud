<div class="signup-container">
  <div class="signup-box">
    <h2>Sign Up</h2>

    <form #signupForm="ngForm" (ngSubmit)="signUp()">
      <!-- Name -->
      <div class="form-group">
        <label>Name</label>

        <input
          type="text"
          name="name"
          [(ngModel)]="user.name"
          required
          minlength="3"
          placeholder="Enter your name"
        />

        <small class="error" *ngIf="serverErrors['name']">
          {{ serverErrors["name"] }}
        </small>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label>Email</label>

        <input
          type="email"
          name="email"
          [(ngModel)]="user.email"
          required
          placeholder="Enter your email"
        />

        <small class="error" *ngIf="serverErrors['email']">
          {{ serverErrors["email"] }}
        </small>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label>Password</label>

        <input
          type="password"
          name="password"
          [(ngModel)]="user.password"
          required
          minlength="6"
          placeholder="Enter your password"
        />

        <small class="error" *ngIf="serverErrors['password']">
          {{ serverErrors["password"] }}
        </small>
      </div>

      <button type="submit">Sign Up</button>
    </form>

    <p>
      Already have an account?
      <a (click)="goToLogin()"> Login </a>
    </p>
  </div>
</div>
