<div class="login-container">

  <div class="login-box">

    <h2>Login</h2>

    <form (ngSubmit)="login()">

      <!-- Email -->
      <div class="form-group">

        <label>Email</label>

        <input
          type="text"
          name="email"
          [(ngModel)]="loginRequest.email"
          placeholder="Enter your email"
        />

        <!-- Email validation error -->
        <small
          class="error"
          *ngIf="serverErrors['email']"
        >
          {{ serverErrors['email'] }}
        </small>

      </div>


      <!-- Password -->
      <div class="form-group">

        <label>Password</label>

        <input
          type="password"
          name="password"
          [(ngModel)]="loginRequest.password"
          placeholder="Enter your password"
        />

        <!-- Password validation error -->
        <small
          class="error"
          *ngIf="serverErrors['password']"
        >
          {{ serverErrors['password'] }}
        </small>

      </div>


      <!-- Login error from service -->
      <div
        class="login-error"
        *ngIf="loginError"
      >
        {{ loginError }}
      </div>


      <button type="submit">
        Login
      </button>

    </form>


    <p>
      Don't have an account?

      <a (click)="goToSignup()">
        Sign Up
      </a>
    </p>

  </div>

</div>
